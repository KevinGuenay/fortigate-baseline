            name: "ALL"
        schedule: "always"
        status: "enable"
        action: "deny"
        name: "BLOCK TRAFFIC TO BAD THREAT FEEDS"
        comments: "{{ comment_string }}"
        policyid: 10003

  - name: "Set correct members on firewall policy to block threat feed access to all destinations"
    when: firewall_policies_enabled
    fortios_firewall_policy:
      vdom: "{{ vdom }}"
      state: "present"
      member_state: "present"
