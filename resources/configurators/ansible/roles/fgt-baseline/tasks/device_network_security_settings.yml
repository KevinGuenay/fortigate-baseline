  - name: "Create initial firewall policy to block threat feed access to all destinations"
    when: firewall_policies_enabled
    fortios_firewall_policy:
      vdom: "{{ vdom }}"
      state: "present"
      firewall_policy:
        srcintf:
          -
            name: "any"
        dstintf:
          -
            name: "any"
        srcaddr:
          -
            name: "TF_{{ threatfeeds[0]['name'] }}"
        dstaddr:
