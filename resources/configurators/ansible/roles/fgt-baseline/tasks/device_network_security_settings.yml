- name: "Block to configure ISDB security"
  when: configure_isdb_security
  block:
  - name: "Create initial ISDB service group for source objects"
    fortios_firewall_internet_service_group:
      vdom: "{{ vdom }}"
      state: "present"
      firewall_internet_service_group:
        name: "BAD-ISDB-SOURCE"
        comment: "{{ comment_string }}"
        direction: "source"
        member:
          -
            name: "{{ bad_isdb_sources[0]}}"

  - name: "Set correct ISDB service group members for source objects"
    fortios_firewall_internet_service_group:
      vdom: "{{ vdom }}"
      state: "present"
      member_state: "present"
      member_path: member:name
      firewall_internet_service_group:
        name: "BAD-ISDB-SOURCE"
        comment: "{{ comment_string }}"
        direction: "source"
        member:
          -
            name: "{{ item }}"
    loop: "{{ bad_isdb_sources }}"
    ignore_errors: true #Errors are ignored, because some ISDB entries can have different names depending on the installed ISDB version

  - name: "Create initial ISDB service group for destination objects"
    fortios_firewall_internet_service_group:
      vdom: "{{ vdom }}"
      state: "present"
      firewall_internet_service_group:
        name: "BAD-ISDB-DESTINATION"
        comment: "{{ comment_string }}"
        direction: "destination"
        member:
          -
            name: "{{ bad_isdb_destinations[0] }}"

  - name: "Set correct ISDB service group members for destination objects"
    fortios_firewall_internet_service_group:
      vdom: "{{ vdom }}"
      state: "present"
      member_state: "present"
      member_path: member:name
      firewall_internet_service_group:
        name: "BAD-ISDB-DESTINATION"
        comment: "{{ comment_string }}"
        direction: "destination"
        member:
          -
            name: "{{ item }}"
    loop: "{{ bad_isdb_destinations }}"
    ignore_errors: true #Errors are ignored, because some ISDB entries can have different names depending on the installed ISDB version

  - name: "Create firewall policy to block bad ISDB access from all sources"
    when: firewall_policies_enabled
    fortios_firewall_policy:
      vdom: "{{ vdom }}"
      state: "present"
      firewall_policy:
        srcintf:
          -
            name: "any"
        dstintf:
          -
            name: "any"
        srcaddr:
          -
            name: "all"
        internet_service_group:
          -
            name: "BAD-ISDB-DESTINATION"
        service:
          -
            name: "ALL"
        schedule: "always"
        internet_service: "enable"
        status: "enable"
        action: "deny"
        name: "BLOCK TRAFFIC TO BAD ISDB"
        comments: "{{ comment_string }}"
        policyid: 10004

  - name: "Create disabled firewall policy to block bad ISDB access from all sources"
    when: not firewall_policies_enabled
    fortios_firewall_policy:
      vdom: "{{ vdom }}"
      state: "present"
      firewall_policy:
        srcintf:
          -
            name: "any"
        dstintf:
          -
            name: "any"
        srcaddr:
          -
            name: "all"
        internet_service_group:
          -
            name: "BAD-ISDB-DESTINATION"
        service:
          -
            name: "ALL"
        schedule: "always"
        internet_service: "enable"
        status: "disable"
        action: "deny"
        name: "BLOCK TRAFFIC TO BAD ISDB"
        comments: "{{ comment_string }}"
        policyid: 10004

  - name: "Create firewall policy to block all sources bad ISDB access"
    when: firewall_policies_enabled
    fortios_firewall_policy:
      vdom: "{{ vdom }}"
      state: "present"
      firewall_policy:
        srcintf:
          -
            name: "any"
        dstintf:
          -
            name: "any"
        dstaddr:
          -
            name: "all"
        internet_service_src_group:
          -
            name: "BAD-ISDB-SOURCE"
        service:
          -
            name: "ALL"
        schedule: "always"
        internet_service_src: "enable"
        status: "enable"
        action: "deny"
        name: "BLOCK BAD ISDB TO ANY"
        comments: "{{ comment_string }}"
        policyid: 10005

  - name: "Create disabled firewall policy to block all sources bad ISDB access"
    when: not firewall_policies_enabled
    fortios_firewall_policy:
      vdom: "{{ vdom }}"
      state: "present"
      firewall_policy:
        srcintf:
          -
            name: "any"
        dstintf:
          -
            name: "any"
        dstaddr:
          -
            name: "all"
        internet_service_src_group:
          -
            name: "BAD-ISDB-SOURCE"
        service:
          -
            name: "ALL"
        schedule: "always"
        internet_service_src: "enable"
        status: "disable"
        action: "deny"
        name: "BLOCK BAD ISDB TO ANY"
        comments: "{{ comment_string }}"
        policyid: 10005

  - name: "Create local-in policy to block access from bad ISDB to FortiGate"
    when: local_in_policies_enabled
    fortios_firewall_local_in_policy:
      vdom: "{{ vdom }}"
      state: "present"
      firewall_local_in_policy:
        intf: "any"
        intf_dict:
          -
            name: "any"
        internet_service_src_group:
          -
            name: "BAD-ISDB-SOURCE"
        logtraffic: "enable"
        service:
          -
            name: "ALL"
        dstaddr:
          -
            name: "all"
        schedule: "always"
        internet_service_src: "enable"
        status: "enable"
        action: "deny"
        comments: "BLOCK ISDB SOURCES TO FORTIGATE. {{ comment_string }}"
        policyid: 10005

  - name: "Create disabled local-in policy to block access from bad ISDB to FortiGate"
    when: not local_in_policies_enabled
    fortios_firewall_local_in_policy:
      vdom: "{{ vdom }}"
      state: "present"
      firewall_local_in_policy:
        intf: "any"
        intf_dict:
          -
            name: "any"
        internet_service_src_group:
          -
            name: "BAD-ISDB-SOURCE"
        logtraffic: "enable"
        service:
          -
            name: "ALL"
        dstaddr:
          -
            name: "all"
        schedule: "always"
        internet_service_src: "enable"
        status: "disable"
        action: "deny"
        comments: "BLOCK ISDB SOURCES TO FORTIGATE. {{ comment_string }}"
        policyid: 10005

- name: "Disable FortiCloud SSO"
  fortios_system_global:
    vdom: "{{ vdom }}"
    system_global:
      admin_forticloud_sso_login: "disable"

- name: "Stronger encryption for FortiGate and stronger Diffie-Hellman"
  fortios_system_global:
    vdom: "{{ vdom }}"
    system_global:
      dh_params: "8192"
      strong_crypto: "enable"

- name: "Disable static TLS keys for FortiGate-terminated traffic"
  fortios_system_global:
    vdom: "{{ vdom }}"
    system_global:
      ssl_static_key_ciphers : "disable"

- name: "USB auto-install of configurations and firmware should be disabled"
  fortios_system_auto_install:
    vdom: "{{ vdom }}"
    system_auto_install:
      auto_install_config: "disable"
      auto_install_image: "disable"